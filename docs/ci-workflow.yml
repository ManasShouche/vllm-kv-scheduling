name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-client.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/summarize_public_results.py
      - run: python -m lab.selfcheck --output "${RUNNER_TEMP}/kv-fixture"
